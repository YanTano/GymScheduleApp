<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Schedule Plan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Active Fitness Gym Schedule</h1>
    </header>

    <main>
        <section class="form-section">
            <h2>Add Workout</h2>
            <form id="workout-form">
                <input type="text" id="workout-name" placeholder="Workout Name" required>
                <input type="date" id="workout-date" required>
                <input type="text" id="workout-duration" placeholder="Duration (hours)" required>
                <button type="submit">Add Workout</button>
            </form>
        </section>

        <section class="schedule-section">
            <h2>Upcoming Workouts</h2>
            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Workout Name</th>
                        <th>Date</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Schedule items will be added here -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
